name: Build Native

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux-x86_64
            runner: ubuntu-latest
            family: linux
            os_name: Linux
            os_arch: x86_64
          - target: Linux-aarch64
            runner: ubuntu-24.04-arm
            family: linux
            os_name: Linux
            os_arch: aarch64
          - target: Mac-x86_64
            runner: macos-15-intel
            family: mac
            os_name: Mac
            os_arch: x86_64
          - target: Mac-aarch64
            runner: macos-15
            family: mac
            os_name: Mac
            os_arch: aarch64
          - target: Windows-x86_64
            runner: ubuntu-latest
            family: windows
            os_name: Windows
            os_arch: x86_64
            cross_prefix: x86_64-w64-mingw32-
          - target: Windows-aarch64
            runner: ubuntu-latest
            family: windows
            os_name: Windows
            os_arch: aarch64
            cross_prefix: aarch64-w64-mingw32-
    steps:
      - uses: actions/checkout@v7

      - name: Delete packaged native libraries
        shell: bash
        run: rm -rf src/main/resources/io/github/idoly/sqlite/native

      - name: Install llvm-mingw
        if: matrix.family == 'windows'
        shell: bash
        env:
          LLVM_MINGW_VERSION: '20260616'
          LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
        run: |
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          directory="$RUNNER_TEMP/llvm-mingw"
          curl --fail --location --retry 5 \
            --output "$archive" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "$LLVM_MINGW_SHA256  $archive" | sha256sum --check
          mkdir "$directory"
          tar -xJf "$archive" -C "$directory" --strip-components=1
          echo "$directory/bin" >> "$GITHUB_PATH"

      - name: Build Linux library
        if: matrix.family == 'linux'
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            docker.io/almalinux:8 \
            sh -c 'dnf install -y gcc make perl && make native OS_NAME=Linux OS_ARCH=${{ matrix.os_arch }}'

      - name: Build macOS library
        if: matrix.family == 'mac'
        shell: bash
        run: make native OS_NAME=${{ matrix.os_name }} OS_ARCH=${{ matrix.os_arch }}

      - name: Build Windows library
        if: matrix.family == 'windows'
        shell: bash
        run: >-
          make native
          OS_NAME=${{ matrix.os_name }}
          OS_ARCH=${{ matrix.os_arch }}
          CROSS_PREFIX=${{ matrix.cross_prefix }}

      - name: Verify native artifact
        shell: bash
        run: |
          test "$(find src/main/resources/io/github/idoly/sqlite/native -type f | wc -l | tr -d ' ')" -eq 1
          find src/main/resources/io/github/idoly/sqlite/native -type f -print0 | xargs -0 file

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: src/main/resources/io/github/idoly/sqlite/native/
          if-no-files-found: error

  update:
    name: Update packaged native libraries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Replace native libraries with build artifacts
        shell: bash
        run: rm -rf src/main/resources/io/github/idoly/sqlite/native

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: src/main/resources/io/github/idoly/sqlite/native/

      - name: Verify complete platform set
        shell: bash
        run: |
          test "$(find src/main/resources/io/github/idoly/sqlite/native -type f | wc -l)" -eq 6
          find src/main/resources/io/github/idoly/sqlite/native -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Commit changed libraries
        uses: EndBug/add-and-commit@v11
        with:
          message: 'chore: rebuild native libraries'
          default_author: github_actions
