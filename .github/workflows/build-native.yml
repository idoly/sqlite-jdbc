name: Build Native

on:
  workflow_dispatch:

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build matrix from Makefile
        id: set-matrix
        # parse the Makefile to retrieve the list of targets in 'native-all', without 'native'
        run: |
          matrix=$((
            echo '{ "target" : ['
            sed -n "/^native-all *: */ { s///; p }" Makefile | sed "s/^native\s//g" | sed 's/ /, /g' | xargs -n 1 echo | sed -r 's/^([^,]*)(,?)$/"\1"\2/'
            echo " ]}"
          ) | jq -c .)
          echo $matrix | jq .
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    name: Build native libraries
    runs-on: ubuntu-latest
    needs: [ matrix ]
    strategy:
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Delete existing libs so we only upload the generated one into the artifact
      - name: Delete existing native libs
        run: rm -fr src/main/resources/io/github/idoly/sqlite/native

      - name: Build native libraries
        run: make ${{ matrix.target }}
        env:
          OCI_EXE: docker

      - name: Verify native artifact
        run: |
          test "$(find src/main/resources/io/github/idoly/sqlite/native -type f | wc -l)" -eq 1
          file src/main/resources/io/github/idoly/sqlite/native/*/*/*

      - name: Upload native libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-${{ matrix.target }}
          path: src/main/resources/io/github/idoly/sqlite/native/

  push:
    name: Push new native libraries to branch
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-libs-*
          merge-multiple: true
          path: src/main/resources/io/github/idoly/sqlite/native/

      - name: Verify complete platform set
        run: |
          test "$(find src/main/resources/io/github/idoly/sqlite/native -type f | wc -l)" -eq 8
          find src/main/resources/io/github/idoly/sqlite/native -type f -print0 | sort -z | xargs -0 sha256sum

      - run: git status

      - name: Commit and push
        uses: EndBug/add-and-commit@v11
        with:
          message: 'chore: update native libraries'
          default_author: github_actions