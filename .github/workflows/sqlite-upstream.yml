name: SQLite upstream version

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare vendored SQLite with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check latest amalgamation version
        shell: bash
        run: |
          vendored_version=$(sed -n 's/^project(sqlitejdbc VERSION \([^ ]*\) LANGUAGES C)$/\1/p' sqlite-native/CMakeLists.txt)
          latest_version=$(curl --fail --retry 3 --silent --show-error https://www.sqlite.org/download.html \
            | sed -n 's/^PRODUCT,\([^,]*\),[^,]*sqlite-amalgamation-[0-9]*\.zip,.*/\1/p' \
            | head -n 1)
          test -n "$vendored_version"
          test -n "$latest_version"
          if [[ "$vendored_version" != "$latest_version" ]]; then
            echo "::error::Vendored SQLite $vendored_version is behind upstream $latest_version"
            exit 1
          fi
