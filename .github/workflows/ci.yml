name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress spotless:check clean package

  native-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn --batch-mode --no-transfer-progress -Pnative integration-test
