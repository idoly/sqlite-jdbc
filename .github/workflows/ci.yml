name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  integration:
    name: Native integration / Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build native library
        run: |
          docker build -f containers/build-linux-glibc/Containerfile -t sqlite-native:glibc .
          mkdir -p native-output
          container_id=$(docker create sqlite-native:glibc)
          docker cp "$container_id:/opt/sqlite-jdbc/." native-output/
          docker rm "$container_id"
      - name: Test packaged native classifier and JDBC integration
        run: >
          ./mvnw --batch-mode --no-transfer-progress verify
          -Dsqlite.native.platform=linux-x86_64-glibc
          -Dsqlite.native.classifier=linux-x86_64-glibc
          -Dsqlite.native.inputDirectory=${{ github.workspace }}/native-output/lib
          -Dsqlite.native.inputFile=libsqlitejdbc.so
      - name: Test JPMS launch with FFM native access
        run: ./integration-tests/run-jpms-test.sh
